# Runs the pipeline on GitHub's own servers instead of this laptop, so it
# updates whether or not the laptop is on, plugged in, or even open.
#
# NOT ACTIVE YET. This only takes effect once this project is pushed to a
# GitHub repository -- it does nothing sitting on disk. To turn it on:
#   1. git init            (this folder isn't a git repo yet)
#   2. git add . && git commit -m "initial commit"
#   3. create a repo on github.com and `git push` this to it
#   4. in the repo's Settings -> Actions -> General, under "Workflow
#      permissions", choose "Read and write permissions" (so the job below
#      can commit the day's data back).
# After that, this runs itself -- nothing more to do.
#
# Times are UTC. 01:30 / 07:30 / 13:30 UTC = 07:00 / 13:00 / 19:00 IST, the
# same three times as the Windows Task Scheduler job on the laptop. Once this
# is live, the laptop's scheduled task is redundant and can be disabled.
name: Daily crop price update

on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch: {}  # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # seasonality.py needs statsmodels (STL) and numpy. Everything else is
      # standard library, so this is the whole dependency story.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's prices and arrivals, rebuild the page
        run: python daily_update.py

      - name: Commit and push whatever changed
        if: always()  # a failed fetch still leaves earlier days worth saving
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ volume/ build_cache.json crop_calendar.html reporting_log.jsonl
          git diff --cached --quiet || git commit -m "Daily update: $(date -u +%Y-%m-%d)"
          git push
